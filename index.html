<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yes or No?</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow:hidden;
}
#app{padding:24px;width:100%;max-width:500px}
h1{font-size:clamp(30px,8vw,48px)}
button{
  padding:14px 32px;
  margin:10px;
  border:0;
  border-radius:8px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}
#yes{background:#20c767;color:#fff}
#no{background:#e83b3b;color:#fff}
#scare{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  background:#000;
  justify-content:center;
  align-items:center;
}
#scare img{
  width:100%;
  height:100%;
  object-fit:contain;
}
#flash{
  position:fixed;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:20;
}
#flash.active{
  animation:flash .12s steps(1,end) infinite;
}
@keyframes flash{
  0%,49%{opacity:.5}
  50%,100%{opacity:0}
}
#close{
  position:fixed;
  z-index:30;
  right:12px;
  top:12px;
  padding:10px 15px;
  font-size:16px;
}
</style>
</head>
<body>

<div id="app">
  <h1>YES OR NO?</h1>
  <p>Choose your answer 👀</p>
  <button id="yes">YES</button>
  <button id="no">NO</button>
</div>

<div id="scare">
  <img id="scareImage" alt="Jeff the Killer jumpscare">
</div>
<div id="flash"></div>
<button id="close" hidden>CLOSE</button>

<audio id="scream" preload="auto"
src="https://www.myinstants.com/media/sounds/jeff-the-killer-screaming.mp3"></audio>

<script>
const jeffURL =
"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1XCZpeb7LNB4G90LVUScsUzzxrRXvjVgQv9PwMvy0VJdYyLIC2Kcfjx0&s=10";

const uploadedPicture = "1000008817.jpg";

const scare = document.getElementById("scare");
const scareImage = document.getElementById("scareImage");
const flash = document.getElementById("flash");
const scream = document.getElementById("scream");
const closeButton = document.getElementById("close");

function triggerScare() {
  scareImage.src = jeffURL;
  scare.style.display = "flex";
  flash.classList.add("active");
  closeButton.hidden = false;

  scream.currentTime = 0;
  scream.play().catch(() => {});

  if (!scareImage.complete || scareImage.naturalWidth === 0) {
    scareImage.onerror = () => {
      scareImage.onerror = null;
      scareImage.src = uploadedPicture;
    };
  }
}

document.getElementById("yes").addEventListener("click", triggerScare);
document.getElementById("no").addEventListener("click", triggerScare);

closeButton.addEventListener("click", () => {
  flash.classList.remove("active");
  scare.style.display = "none";
  closeButton.hidden = true;
  scream.pause();
  scream.currentTime = 0;
});
</script>
</body>
</html>
